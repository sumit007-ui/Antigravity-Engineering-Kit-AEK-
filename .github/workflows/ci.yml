name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy static analysis
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Execute test suite
        run: cargo test --workspace --verbose

      - name: Build release binaries
        run: cargo build --workspace --release --verbose

  msrv:
    name: MSRV Verification (Rust 1.85.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.85.0"

      - name: Build on MSRV
        run: cargo build --workspace --verbose

      - name: Test on MSRV
        run: cargo test --workspace --verbose

  supply-chain:
    name: Supply Chain & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8

      - name: Install cargo-deny
        uses: taiki-e/install-action@5132d735058444a70b04eb586df6834d8d1e2a0e # cargo-deny
        with:
          tool: cargo-deny

      - name: Run cargo deny check
        run: cargo deny check

      - name: Verify Documentation Build (-D warnings)
        run: cargo doc --workspace --no-deps

      - name: Integrity Gate: No stub / placeholder markers in non-test code
        run: |
          ! grep -rnIE "TODO!|FIXME!|In production," crates/*/src/

  web:
    name: Frontend Test & Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        run: npm test

      - name: Build Next.js application
        run: npm run build


