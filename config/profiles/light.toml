# AEK Profile: LIGHT
# Target: Low-resource developer environments (8 GB RAM machines, containers, CI runners).
# Features: Core CLI, configuration management, and basic diagnostics without persistent daemons.

[general]
name = "AEK-Light"
config_version = 1
profile = "light"

[logging]
level = "info"
format = "text"

[execution]
dry_run = false
max_concurrent_tasks = 2
default_timeout_seconds = 30

[security]
allow_destructive_operations = false
require_confirmation = true

[integrations]
mcp_enabled = false
prompt_optimization_enabled = false
security_scanning_enabled = false

