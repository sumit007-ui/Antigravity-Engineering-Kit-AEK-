[workspace]
members = [
    "crates/aek-core",
    "crates/aek-config",
    "crates/aek-platform",
    "crates/aek-rules",
    "crates/aek-skills",
    "crates/aek-agents",
    "crates/aek-mcp",
    "crates/aek-mcp-integrations",
    "crates/aek-languages",
    "crates/aek-validation",
    "crates/aek-security",
    "crates/aek-reporting",
    "crates/aek-distribution",
    "crates/aek-prompt",
    "crates/aek-prompt-adapters",
    "crates/aek-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Antigravity Engineering Kit Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/sumit007-ui/Antigravity-Engineering-Kit-AEK-"
readme = "README.md"
rust-version = "1.85.0"

[workspace.dependencies]
# Internal crates
aek-core = { path = "crates/aek-core", version = "0.2.0" }
aek-config = { path = "crates/aek-config", version = "0.2.0" }
aek-platform = { path = "crates/aek-platform", version = "0.2.0" }
aek-rules = { path = "crates/aek-rules", version = "0.2.0" }
aek-skills = { path = "crates/aek-skills", version = "0.2.0" }
aek-agents = { path = "crates/aek-agents", version = "0.2.0" }
aek-mcp = { path = "crates/aek-mcp", version = "0.2.0" }
aek-mcp-integrations = { path = "crates/aek-mcp-integrations", version = "0.2.0" }
aek-languages = { path = "crates/aek-languages", version = "0.2.0" }
aek-validation = { path = "crates/aek-validation", version = "0.2.0" }
aek-security = { path = "crates/aek-security", version = "0.2.0" }
aek-reporting = { path = "crates/aek-reporting", version = "0.2.0" }
aek-distribution = { path = "crates/aek-distribution", version = "0.2.0" }
aek-prompt = { path = "crates/aek-prompt", version = "0.2.0" }
aek-prompt-adapters = { path = "crates/aek-prompt-adapters", version = "0.2.0" }

# Error handling
thiserror = "2.0.11"
anyhow = "1.0.95"

# Async runtime
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }

# HTTP client
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "json"] }

# CLI parsing
clap = { version = "4.5.31", features = ["derive", "cargo", "env"] }

# Serialization & Config
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.138"
toml = "1.1.8"

# Time & Timestamps
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std", "serde"] }

# Diagnostics & Observability
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

# Filesystem & OS
tempfile = "3.16.0"
directories = "6.0.0"
semver = { version = "1.0.25", features = ["serde"] }
sha2 = "0.10.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

