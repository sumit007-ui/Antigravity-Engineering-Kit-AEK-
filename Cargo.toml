[workspace]
members = [
    "crates/aek-core",
    "crates/aek-config",
    "crates/aek-platform",
    "crates/aek-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Antigravity Engineering Kit Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/google-antigravity/aek"
readme = "README.md"
rust-version = "1.85.0"

[workspace.dependencies]
# Internal crates
aek-core = { path = "crates/aek-core", version = "0.1.0" }
aek-config = { path = "crates/aek-config", version = "0.1.0" }
aek-platform = { path = "crates/aek-platform", version = "0.1.0" }

# Error handling
thiserror = "2.0.11"
anyhow = "1.0.95"

# Async runtime
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "process", "time"] }

# CLI parsing
clap = { version = "4.5.31", features = ["derive", "cargo", "env"] }

# Serialization & Config
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.138"
toml = "0.8.20"

# Time & Timestamps
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std", "serde"] }

# Diagnostics & Observability
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

# Filesystem & OS
tempfile = "3.16.0"
directories = "6.0.0"
semver = { version = "1.0.25", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

