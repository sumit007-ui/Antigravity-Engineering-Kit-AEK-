<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFD36B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Classified Terminal Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="#0D0B18" stroke="#FFD36B" stroke-width="8"/>
  <rect x="12" y="12" width="104" height="104" rx="20" fill="none" stroke="#FFD36B" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- AEK Brand Monogram Typography -->
  <text x="64" y="80" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" 
        font-size="44" 
        font-weight="900" 
        fill="#FFD36B" 
        text-anchor="middle" 
        letter-spacing="1.5"
        filter="url(#goldGlow)">AEK</text>
</svg>
